name: AI README Generator

on:
  push:
    branches:
      - hlg

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install @google/generative-ai
          npm install uuid

      - name: Generate README
        env:
          GEMINI_API_KEY: ${{ secrets.AGENT_SECRET }}
        run: node .github/scripts/generate-readme.js

      - name: Check for changes
        id: git-check
        run: |
          if git diff --quiet README.md; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.git-check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: update README"
          title: "docs: AI-generated README update"
          body: |
            This PR updates the README automatically based on repository changes.

            Generated by Gemini AI.
          branch: ai/readme-update  
          delete-branch: true